<!DOCTYPE html>
<html lang="ca">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MHBSFUT - Consola</title>
  <link rel="icon" type="image/png" href="assets/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>

  <!-- Top Navigation Header -->
  <header class="header">
    <a href="index.html" class="brand-title">MHBSFUT</a>
    <nav class="nav-links">
      <a href="screens/console.html" class="nav-link active">Consola</a>
      <a href="screens/app.html" class="nav-link">APP</a>
    </nav>
  </header>

  <!-- Main Login Screen -->
  <main class="main-content">
    <div class="login-card">
      <img src="assets/images/logo.png" alt="MHBASFUT Logo" class="app-icon">
      <h1 class="login-title">Benvingut a MHBASFUT</h1>
      <form class="login-form" action="screens/console.html" method="get">
        <input 
          type="text" 
          name="usuari" 
          class="input-field" 
          placeholder="usuari" 
          autocomplete="username" 
          required
        >
        <input 
          type="password" 
          name="contrasenya" 
          class="input-field" 
          placeholder="contrasenya" 
          autocomplete="current-password" 
          required
        >
        <button type="submit" class="btn-submit">acceder</button>
      </form>
    </div>
  </main>

</body>
</html>
